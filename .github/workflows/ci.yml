name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t sourcebook .
      - name: Smoke test
        run: |
          docker run -d --name sb -p 8000:8000 sourcebook
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs sb
          exit 1
