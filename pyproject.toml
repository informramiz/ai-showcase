[project]
name = "sourcebook"
version = "0.1.0"
description = "Document Q&A with streamed, cited answers: FastAPI, Claude tool use, SQLite FTS5 retrieval."
readme = "README.md"
authors = [
    { name = "Ramiz Raja", email = "informramiz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.8.0",
    "fastapi>=0.162.4",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sourcebook = "sourcebook:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "C4", "PT", "RET", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: calls a real model; needs ANTHROPIC_API_KEY (run with -m live)"]

[tool.coverage.run]
source = ["sourcebook"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
